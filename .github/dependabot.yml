version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      nuget-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    # net8.0 requires the 7.4 asset line; PowerShell 7.5+ no longer ships net8.0 compile assets.
    ignore:
      - dependency-name: "Microsoft.PowerShell.SDK"
        versions: ["[7.5.0,)"]
